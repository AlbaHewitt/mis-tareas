# Cada 5 minutos mira qué avisos tocan y los manda a los móviles que los tienen activados.
# GitHub puede retrasar unos minutos estas ejecuciones; por eso los avisos se mandan aunque lleguen algo tarde.
name: Avisos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/avisos/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/avisos
      - run: node avisos.mjs
        working-directory: tools/avisos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
