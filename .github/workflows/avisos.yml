# Mira qué avisos tocan y los manda a los móviles que los tienen activados.
# Lo lanza cada 5 minutos el despertador de Cloudflare (tools/despertador), porque el cron de GitHub
# a veces tarda horas. El cron de aquí abajo queda de reserva por si el despertador fallara.
# Si dos ejecuciones coinciden, la segunda no repite avisos: lo enviado se apunta en pushlog.
name: Avisos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/avisos/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tools/avisos
      - run: node avisos.mjs
        working-directory: tools/avisos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
